# Nightly Iceberg cleanup: expire old snapshots + remove orphan files so the
# prune DELETEs actually reclaim object-store space. File compaction is handled
# more frequently by the optimize CronJob. Schedule off-peak, after prune.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: trino-query-log-sink-maintain
  namespace: trino
  labels:
    app.kubernetes.io/name: trino-query-log-sink
    app.kubernetes.io/component: maintain
spec:
  # Daily at 03:30, after the 03:00 prune job.
  schedule: "30 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: trino-query-log-sink
            app.kubernetes.io/component: maintain
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: maintain
              image: ghcr.io/shadi/trino-log-sink:latest
              args: ["maintain"]
              envFrom:
                - configMapRef:
                    name: trino-query-log-sink
                - secretRef:
                    name: trino-query-log-sink
              resources:
                requests:
                  cpu: 25m
                  memory: 32Mi
                limits:
                  cpu: 500m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
