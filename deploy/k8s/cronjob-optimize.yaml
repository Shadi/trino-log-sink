# Frequent compaction of the recent (OPTIMIZE_DAYS) partitions. Each flush writes
# one small Parquet file; without regular compaction the hot partition accumulates
# many tiny files and UI reads get slow. Runs hourly, scoped to recent days so it
# stays cheap.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: trino-query-log-sink-optimize
  namespace: trino
  labels:
    app.kubernetes.io/name: trino-query-log-sink
    app.kubernetes.io/component: optimize
spec:
  schedule: "15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: trino-query-log-sink
            app.kubernetes.io/component: optimize
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: optimize
              image: ghcr.io/shadi/trino-log-sink:latest
              args: ["optimize"]
              envFrom:
                - configMapRef:
                    name: trino-query-log-sink
                - secretRef:
                    name: trino-query-log-sink
              resources:
                requests:
                  cpu: 25m
                  memory: 32Mi
                limits:
                  cpu: 500m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
