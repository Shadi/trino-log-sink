apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-query-log-sink
  namespace: trino
  labels:
    app.kubernetes.io/name: trino-query-log-sink
data:
  LISTEN_ADDR: ":8080"
  TRINO_HOST: "trino-cluster-trino.trino"
  TRINO_PORT: "8080"
  TRINO_USER: "trino-query-log"
  TRINO_SOURCE: "trino-query-log"
  TRINO_CATALOG: "querylog"
  TRINO_SCHEMA: "observability"
  TRINO_TABLE: "trino_query_log"
  ICEBERG_LOCATION: ""
  BATCH_SIZE: "2000"
  FLUSH_INTERVAL: "10m"
  BUFFER_CAPACITY: "5000"
  FLUSH_MAX_RETRIES: "3"
  MAX_STATEMENT_BYTES: "700000"
  MAX_FIELD_BYTES: "300000"
  TRINO_QUERY_TIMEOUT: "300s"
  PLAN_CAPTURE: "slow_or_failed"
  PLAN_CAPTURE_MIN_WALL: "2m"
  QUERY_PREVIEW_BYTES: "200"
  RETENTION_DAYS: "2"
  OPTIMIZE_DAYS: "1"
  MAINTAIN_RETENTION: "6h"
  READINESS_MODE: "connection"
  READINESS_INTERVAL: "30s"
  READINESS_FAIL_INTERVAL: "30s"
  READINESS_TIMEOUT: "10s"
  METRICS_ENABLED: "true"
  LOG_LEVEL: "info"
  REDIS_ADDR: ""
  CACHE_LIST_TTL: "10m"
  CACHE_QUERY_TTL: "48h"
