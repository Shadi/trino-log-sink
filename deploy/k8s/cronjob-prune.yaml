apiVersion: batch/v1
kind: CronJob
metadata:
  name: trino-query-log-sink-prune
  namespace: trino
  labels:
    app.kubernetes.io/name: trino-query-log-sink
    app.kubernetes.io/component: prune
spec:
  # Daily at 03:00. Deletes rows older than RETENTION_DAYS.
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: trino-query-log-sink
            app.kubernetes.io/component: prune
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: prune
              image: ghcr.io/shadi/trino-query-log-sink:latest
              args: ["prune"]
              envFrom:
                - configMapRef:
                    name: trino-query-log-sink
                - secretRef:
                    name: trino-query-log-sink
              resources:
                requests:
                  cpu: 25m
                  memory: 32Mi
                limits:
                  cpu: 250m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
